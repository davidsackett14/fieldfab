<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FieldFab - Gored Elbow</title>
<style>
body{font-family:system-ui;margin:0;background:#f1f5f9;color:#0f172a}header{background:#0f172a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}header a{color:#7dd3fc;font-weight:700;text-decoration:none}main{padding:12px;max-width:1100px;margin:auto}.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}label{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:4px}input,select{font-size:17px;padding:8px;border:1px solid #94a3b8;border-radius:6px}button{font-size:16px;font-weight:800;padding:10px 16px;border:0;border-radius:8px;background:#0284c7;color:#fff;margin-top:10px;margin-right:8px}#err{color:#b91c1c;font-weight:700}#view,#elbowView{width:100%;height:420px;background:#fff}#elbowView{touch-action:none}.viewerHead{display:flex;justify-content:space-between;gap:12px;align-items:center}.viewerHead h2{margin:0}.viewerHead p{margin:3px 0 0;color:#475569}canvas{width:100%;height:100%}table{border-collapse:collapse;width:100%}td,th{border:1px solid #cbd5e1;padding:6px;text-align:left}
@media print{header,.inputs,#tables,button{display:none!important}@page{size:letter landscape;margin:.75in}.card{box-shadow:none;padding:0}#view{height:6.9in}}
</style></head><body>
<header><strong>FieldFab - Gored Elbow</strong><a href="index.html">Back to transitions</a></header>
<main>
<div class="card inputs"><div class="grid">
<label>Inner (throat) diameter<input id="id" value="12"></label>
<label>Outer (heel) diameter<input id="od" value="36"></label>
<label>Number of gores<input id="n" type="number" min="2" value="5"></label>
<label>Elbow angle (deg)<input id="ang" type="number" value="90"></label>
<label>Show<select id="which"><option value="full">Middle gore</option><option value="end">End gore</option></select></label>
</div><button id="go">Build layout</button><button id="printGore">Print gore layout</button><div id="err"></div></div>
<div class="card"><div class="viewerHead"><div><h2>Elbow preview</h2><p>Built from the entered diameters, angle, and gore count. Drag to rotate.</p></div><button id="resetElbow" type="button">Reset view</button></div><div id="elbowView"><canvas id="elbowCanvas"></canvas></div></div>
<div class="card"><div class="viewerHead"><div><h2>Gore layout</h2><p>Flat pattern with quarter-point dimensions.</p></div></div><div id="view"><canvas id="c"></canvas></div></div>
<div class="card" id="tables"></div>
</main><script src="gores.js?v=28"></script></body></html>
